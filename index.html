<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자바스크립트 수업</title>
</head>
<body>
    ddddd
    <!-- 자바스크립트 수업 -->
     <script>
        //  자바 스크립트는 식과 문으로 구성이 된다.
        // 식: 값을 만들어내는 코드 / 표현식(연산식 뿐만 아니라 실제 값도, 함수를 실행하는 것도 식이다)
        const inch = 2;
        // 나는 인치라는 변수에다가 2를 할당한다. 인치는 뭐뭐다 가 아님
        console.log(inch);
        // inch에 뭐가 담겨져있는지 확인하고싶을때
        ("안녕하세요"); //표현식 문자열, 식이다.  
        1 + 2 // 숫자 -연산식(표현식)
        //문: 넓은 의미로 값이나 식까지 포함한다. ~해라
        // 조건문, 제어문등을 예로 사용
        // 알림창 출력
        alert("야러분 안녕하세요");
        // alert()여기서 ()괄호는 ~해라가 된다. 얼랏
        // 확인창 출력
        confirm("정말로 삭제 하시겠습니까?")
        // 확인, 취소가 나오며 둘 중 하나
        prompt("생년월일", "yyyy-mm-dd") //표현하는 문이라고 보면된다
        // 화면 출력
        document.write("최원희");
        //화면에 적어라,
        // 글자크기도 색깔도 변경 못한다? 다만 html, f12. elemnt에서 확인 가능하다. 어떤 태그로도 감싸져있지 않다.
        // 변수
        const name = "최원희";
        // name 이라는 변수(const)를 사용하겠다. name에 변수이름들을 담아놓고 쓰겠다. 
        //적용 시키려면 변수선언 > 적용문 이 순서여야 한다. 적용문 > 변수선언 안됨
        const age = 25;
        const gender = "여자";

        document.write("최길동");
        //화면에 적어라,
        document.write(`<h1>${name}</h1>`)
        document.write(`<h1>${name}</h1> <p>나이는${age}살</p>`)
        document.write(`<h1>${name}</h1> <p>성별은${gender}입니다</p>`)
        document.write(`<h1>${name}</h1>`)
        document.write(`<h1>${name}</h1>`)
        document.write(`<h1>${name}</h1>`)
        document.write(`<h1>${name}</h1>`)
        document.write(`<h1>${name}</h1>`)
        document.write(`<h1>${name}</h1>`)
        document.write(`<h1>${name}</h1>`)

        </script>
        
</body>
</html>

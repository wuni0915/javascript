<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .imgs {
        /* width: 200px; */
      }
      .imgs img {
        width: 100px;
      }
    </style>
  </head>

  <body>
    <ul id="dinner">
      <li>떡볶이</li>
      <li>김치볶음밥</li>
      <li>리조또</li>
      <li>그린카레</li>
    </ul>
    <p id="text"></p>

    <img id="bigimg" src="images/cup-1.png" alt="" />
    <div class="imgs" id="imgs">
      <img src="images/cup-1.png" alt="" />
      <img src="images/cup-2.png" alt="" />
    </div>

    <ul id="todo">
      <li>밥먹기 <button>삭제</button></li>
      <li>공부하기 <button>삭제</button></li>
      <li>놀기 <button>삭제</button></li>
      <li>낮잠자기 <button>삭제</button></li>
    </ul>
    <script>
      const dinner = document.querySelector("#dinner");
      const text = document.querySelector("#text");
      dinner.addEventListener("click", (e) => {
        console.log(e.target);
        text.innerHTML = `오늘 선택한 저녁메뉴는 ${e.target.innerHTML}입니다`;
      });
      // li의 텍스트를 출력하려면 해당 li의 innerHTML을 해야한다.
      const bigimg = document.querySelector("#bigimg");
      const imgs = document.querySelectorAll("#imgs img");

      imgs.forEach((img) => {
        img.addEventListener("click", () => {
          bigimg.src = img.src;
        });
      });

      const todo = document.querySelector("#todo");
      const btn = document.querySelectorAll("button");

      todo.addEventListener("click", (e) => {
        if (e.target.tagName === "BUTTON") {
            e.target.parentElement.remove();
            // btn.parentElement.remove();
          // 이 코드는 버튼을 전부 가져오는 게 아니라 첫 번째 버튼 하나만 선택해.
        }
      });
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #cover2 {
            width: 100px;
            border-radius: 50%;
            border: 1px solid red;
        }
    </style>
</head>
<body>
    <img src="images/easys-1.jpg" alt="이미지" id="cover">
    <script>
        const cover = document.getElementById("cover")
        console.log(cover);
        console.log(cover.src);
        console.log(cover.alt);
        cover.addEventListener("mouseover", (event)=>{
            cover.src ="images/easys-2.jpg"
            cover.id = "cover2"
            console.log(event.target.src)
            // console.log(event.target) 타겟이 누군지 알 수 있다.
        })
        cover.addEventListener("mouseout", ()=>{
            cover.src ="images/easys-1.jpg"
            cover.id = "cover"
        })
    </script>
</body>
</html>

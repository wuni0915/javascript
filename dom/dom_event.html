<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .imgbox img {
        width: 100px;
      }
    </style>
  </head>
  <body>
    <ul id="menu">
      <li>회사소개</li>
      <li>제품센터</li>
      <li>고객센터</li>
    </ul>
    <div id="result">
      <!-- 내가 클릭한 글자 js출력 -->
    </div>
    <!-- 클릭한 이미지 크게 보이기 -->
    <!-- 큰 이미지 -->
    <img src="images/cup-1.png" alt="redcup" id="big" />
    <!-- 작은 이미지 -->
    <div class="imgbox">
      <img src="images/cup-1.png" alt="red" />
      <img src="images/cup-2.png" alt="blue" />
    </div>
    <!-- 삭제 버튼 만들기 -->
    <ul id="todo">
      <li>공부하기<button>삭제</button></li>
      <li>운동하기<button>삭제</button></li>
      <li>청소하기<button>삭제</button></li>
    </ul>
    <script>
      const menuE = document.getElementById("menu");
      const result = document.getElementById("result");
      menuE.addEventListener("click", (e) => {
        console.log(e.target);
        result.innerHTML = `<p>내가 클릭한 메뉴 : <span>${e.target.innerText}</span></p>`;
        // result.innerHTML += `<p>내가 클릭한 메뉴 : <span>${e.target.innerText}</span></p>`
      });
      //   작은 이미지 클릭시 큰 이미지 변경
      const imgbox = document.querySelector(".imgbox");
      const imgs = document.querySelectorAll(".imgbox img");
      console.log(imgs);

      const big = document.querySelector("#big");
      // imgbox.addEventListener("click", (e)=>{
      //     console.log(e.target.src);
      //     // 큰이미지 변경
      //     big.src = e.target.src;
      // });
      // querySelectorAll => nodeList
      imgs.forEach((img) => {
        console.log(img);
        img.addEventListener("click", () => {
          big.src = img.src;
        });
      });
      // 삭제 버튼
      const todo = document.getElementById("todo");
      todo.addEventListener("click", (e) => {
        console.log(e.target.tagName);
        if (e.target.tagName === "BUTTON") {
            // 왜 버튼이 대문자여야 먹는거지 
          e.target.parentElement.remove()
        //   console.log(e.target.parentElement);
        }
      });
    </script>
  </body>
</html>

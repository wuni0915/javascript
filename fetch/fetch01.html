<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="display">
      <!-- js출력 -->
    </div>
    <script>
      // fetch()
      //일반적으로 서버에서 데이터를 가져올때 사용
      //API 요청이나 로컬 JSON 파일 읽는데도 활용
      // 기본형
      // fetch('주소').then(Response).then(data).catch(error);
      // fetch(어디서 데이터 가져올건지에대한 주소).then(매개변수. 서버가 보내준 응답을 받는다.).then(변환이 끝난 실제 데이터를 화면 출력 공간).catch(요청이나 데이터 처리 과정에서 오류가 발생했을때 처리하는 메서드. 에러를 받는다.);
      // 데이터를 바로 주는게 아닌 약속을 돌려준다.
      // http 상태코드
      //200-서버가  요청을 정상적으로 처리 긍정
      //300-요청한 주소에서 다른 주소로 이동해야 하거나 이동이 발생 했음 긍정
      //400-요청에 문제가 있다. 부정
      //500-서버에 문제가 발생 부정, 백에서 문제 협업할때 유용
      fetch("data.json")
        .then((response) => {
          // console.log(response);
          return response.json();
          //제이슨 형식으로 돌려주기 💛
          //객체가 없이 쓰면 return 안해도 된다. <뭔말 💛
          //응답 데이터를 자바스크립에서 사용 할 수 있게 변환.
        })
        .then((data) => {
          // console.log(data);
          const displayEl = document.querySelector("#display");
          displayEl.innerHTML = `
                     <p>이름:${data.name}</p>
         <p>나이:${data.age}years-old</p>
         <p>도시:${data.city}</p>
         `;
        })
        .catch((error) => {
          console.log("오류발생:", error);
          // 적어둬야 캐치에서 오류를 확인할수 있다.
        });
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>map()</title>
</head>
<body>
    <!-- map() 기존 데이터를 하나씩 꺼내서 다른 데이터로 바꾸고, 새로운 배열로 만드는 메서드다. -->
     <script>
        const prices = [1000, 2000, 3000];
        console.log(prices);
        const newPrices = prices.map((price)=>{
            console.log(price);
            // 여기까지는 폴이치랑 같은 결과가 나옴
            return price + 1000;
        })
        // 돌려받은 값들을 모아서 새 배열로 만든다.
        console.log(newPrices);//[2000, 3000, 4000]
        const numbers = [1,2,3,4]
        // const result = numbers.map((num)=>{
        //     console.log(num);
        //     return num * 2 ;
        //     // 리턴으로 반환값을 내지 않으면 안된다.
            
        // })
        const result = numbers.map((num)=>num * 2)
        // 화살표 함수 쓸때 중괄호를 안쓰면 리턴을 안써도 알아서 반환을 한다.
        console.log(result);
        
     </script>
</body>
</html>

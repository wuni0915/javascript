<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>filter()</title>
</head>
<body>
    <!-- filter() 조건에 맞는 데이터만 골라내기 메서드 -->
     <script>
        const scores = [45, 80, 55, 90, 70];
        console.log(scores);
        const passed = scores.filter((score)=>{
            console.log(score);
            return score >= 60;
            // 해당 되는 애들만 나온다.
            
        })
        // 5000원 이하인 상품만 고르기
        console.log(passed);
        const prices = [3000, 8000, 5000, 12000, 4000]
        // console.log(prices);
        const result = prices.filter((price)=>{
            console.log(price);
            return price <= 5000;
            // 5000원보다 작거나 같은것을 반환해라
        })
        document.write(result)
        // 폴이치 하나씩 꺼내서 실행, 맵 하나씩 꺼내서 변환해서 실행, 필터는 하나씩 꺼내서 조건에 맞는 애들만 실행
     </script>
</body>
</html>

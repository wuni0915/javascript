<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>조건문 if - else</title>
</head>
<body>
    <script>
        //if 기본 구조
        // if(참일때){여기에 뭔가를 해라}else{그게 아니면 이걸 해라}
        // if(조건){실행 코드}
        let age = 25;
        if(age < 20){
            console.log("미성년자 입니다.");
        }else{console.log("성인 입니다.")}
    </script>
</body>
</html>

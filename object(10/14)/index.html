<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>객체</title>
</head>
<body>
    <!-- 객체- 여러가지 정보를 하나로 묶어 놓은것 -->
     <!-- 내장 객체- 자바스크립트가 미리 만들어 놓은 객체 -->
      <!-- Date, Array, String(글자 수, 길이를 알수 있다), Math -->
    <script>
        //1.String 내장 객체는 첫글자 대문자로 쓴다.
        const str = "Hello world";
        // 위에 대한 정보를 알고 싶으면 스트링으로 알 수 있다.
        console.log(str);
        console.log(str.length);
        // 띄어쓰기를 포함한 글자가 11 로 길이가 11로 나온다. 문자의 길이를 알 수 있는 속성
        console.log(str.toUpperCase());
        // toUpperCase 같은건 내장 함수. 대문자변경 메소드 
        console.log(str.includes("world"));
        // str안에 (해당 내용)이 포함 되어있는지 확인해라/ 참 거짓으로 뜬다. 대소문자 여부는 따지는데 내장 함수로 어퍼케이스, 로우케이스 된 경우는 따지지 않는다.

        // 2.Array------------------------------------------------
        const arr = [1, 2, 3, 4];
        //중괄호 == 배열
        console.log(arr);
        // 0부터 시작하는 인덱스 번호다 길이는 4로 나온다. 하나하나 못 세아려볼때 알 수 있다.
        console.log(arr.length);
        console.log(arr.push(5));
        console.log(arr);
        console.log(arr.join("/"));
        // 3.Date
        const today = new Date();
        console.log(today);
        console.log(today.getMonth() + 1);
        //현재 날짜 (월 0부터 시작하기 때문에 더하기 1을 해줘야 한다)
        console.log(today.toDateString());
        console.log(today.toLocaleDateString());
        //우리한테 맞는걸로 나옴
        console.log(today.getFullYear());

        // 4.Math-------------------------------------------------
        console.log(Math.PI); //3.141592653589793
        console.log(Math.max(10, 23, 100, 50));
        //여기서 제일 큰 숫자를 뺸다. 여기선 100
        console.log(Math.min(10, 23, 100, 50));
        //제일 작은 숫자 10 꺼낸다
        console.log(Math.random()); 
        //컴퓨터는 0,1만 표현한다. 여기서 0~1만 랜덤으로 출력한다. 새로고침할때마다 바뀜. 1은 포함하지 않는다. 난수라는 애만 출력
        
    </script>
</body>
</html>

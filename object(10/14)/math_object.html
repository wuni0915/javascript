<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math 객체</title>
</head>
<body>
    <script>
        let num = 2.523;
        let maxNum = Math.max(10, 5, 8, 30);
        console.log(maxNum)
        let minNum = Math.min(10, 5, 8, 30);
        console.log(minNum);
        let roundNum = Math.round(num);
        // let roundNum = Math.round(num); : 소수점 첫째 자리에서 반올림, 반내림해라
        console.log(roundNum);
        // floor() : 소수점을 버리고 내림 (정수로 변함)
        let floorNum = Math.floor(num);
        console.log(floorNum);
        // ceil() : 소수점을 올림하여 정수로 변함. 반내림할 숫자도 무조건 올림
        let ceilNum = Math.ceil(num);
        console.log(ceilNum);
        // random() : 0이상 1사이의 난수 (예 : 0.8214)
        let randomNum = Math.random();
        console.log(randomNum);
        // PI (원주율 값을 반환)
        let piNum = Math.PI;
        console.log(piNum);
    </script>
</body>
</html>

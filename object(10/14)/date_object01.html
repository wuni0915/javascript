<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>현재시간</title>
</head>
<body>
    <p>현재 시각: <strong class="display">
        <!-- js출력 -->
    </strong></p>
    <script>
        //현재 시간을 나타내는 함수를 내가 만든다
        // function을 단독으로 쓸때는 함수 이름을 지어줘야한다. 펑션 이름 (){}
        function displayNow(){
            // console.log("확인");
            let now = new Date();
            // console.log(now);
            const currentTime = now.toLocaleTimeString();
            console.log(currentTime); 
            const display = document.querySelector(".display")
            console.log(display);
            display.innerHTML = `${currentTime}`
            
        }
        //함수 호출 기능 ▼
        // displayNow()
        // 함수를 실행시키려면 함수 호출을 해주어야 한다 그래야 console에뜬다
        // setInterval() : 일정 시간 간격으로 반복 실행하는 함수
        setInterval(displayNow , 1000);
        // 잡스에서 1초는 1000이다.
    </script>
</body>
</html>

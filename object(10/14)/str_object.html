<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String 객체</title>
</head>
<body>
    <script>
        //1.length 속성
        const str = "Hello, Javascript"
        console.log(str.length);
        //2.toUppercase() toLowerCase() 메서드
        console.log(str.toLowerCase());
        console.log(str.toUpperCase());
        //3.include() 해당내용 여부 확인. 메소드
        const email = "user@example.com"
        console.log(email.includes("@")); //true, false 로 뜬다
        // 4.trim() 공백제거 메서드
        const input = " he llo "
        console.log(input.length);
        console.log(input.trim().length);
        //글자 뒤에 있는 공백은 신경 안써도 된다.
        //5.slice() : 시작 인덱스(포함) , 끝인덱스(미포함, 바로 앞까지만 자름)
        const str2 = "JavaScript"
        console.log(str2.slice(4, 10)); // 4~10까지만의 글자를 남겨라
        //6.replace() : 문자교체
        const sentence = "I Like Java"
        console.log(sentence.replace("Java", "JavaScript"));
        // 7.split() :문자 분리
        const data = "apple, banana, Orange";
        console.log(data.split(""));
    </script>
</body>
</html>

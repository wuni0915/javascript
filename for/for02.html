<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ul id="list">

    </ul>
    <script>
        const products = [ "사과", "바나나", "포도", "딸기"];
        const proList = document.querySelector("#list");
        for(let i = 0 ; i < products.length ; i++){
            // console.log(i);
            // console.log(products[3]);
            proList.innerHTML += `<li>${products[i]}</li>`
            // 1번 문자열 2번 문자열 ... 이렇게 가져온다.
            
            
        }
    </script>
</body>
</html>

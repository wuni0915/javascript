<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>증가 감소 연산자</title>
</head>
<body>
    <h2 id="counter"> 클릭 횟수: 0</h2>
    <button id="indcrease">증가 (+)</button>
    <button id="decrease">감소 (-)</button>
    <script>
        let counter = document.querySelector("#counter");
        let indc = document.querySelector("#indcrease");
        // console.log(indc, counter);
        let dec = document.querySelector("#decrease");

        let count = 0;
        // 증가 함수
        indc.addEventListener("click", function(){
            // console.log("click") 클릭 되면 click라는 문구가 뜬다 "" 문구열
            count++
            // console.log(count);
            counter.textContent = `클릭 횟수 : ${count}`;
        })
        // 감소 함수
        dec.addEventListener("click", function(){
            // console.log("--")
            count--
            counter.textContent = `클릭 횟수 : ${count}`;
        })
    </script>
</body>
</html>

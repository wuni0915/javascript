<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tab02</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      ul,
      li {
        list-style: none;
      }

      img {
        /* width: 100%; */
      }
      /* menu */
      .menu {
        width: 50%;
        max-width: 600px;
        display: flex;
        margin: 50px auto;
        background-color: antiquewhite;
      }
      .menu-item {
        flex: 1;
        /* 자식들 다 똑같이 1 1 1 주겠다. */
        text-align: center;
        padding: 10px;
        transition: all 0.3s;
      }
      .menu-item:hover,
      .menu-item.active {
        background-color: rgb(255, 215, 164);
        cursor: pointer;
      }
      /* 탭 내용 */
      .card-container {
        width: 60%;
        max-width: 700px;
        margin: auto;
      }
      /* js출력 ul 부분 */
      .card {
        /* display: flex; */
        display: none;
        gap: 20px;
        padding: 20px;
        border: 1px solid #ccc;
      }
      .card.active {
        display: flex;
      }
      .card li {
        flex: 1;
      }

      .card img {
        width: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <!-- 탭 메뉴 -->
    <div class="menu" id="menu">
      <!-- js출력 -->
    </div>
    <!-- 카드영역 -->
    <div class="card-container" id="cardContainer">
      <!-- js출력 -->
    </div>
    <script>
      //더미데이터
      const menuData = [
        {
          title: "메뉴 1",
          product: [
            { image: "images/frame1.png", name: "아메리카노", price: 6000 },
            { image: "images/frame2.png", name: "카페라떼", price: 6500 },
            { image: "images/frame3.png", name: "바닐라라떼", price: 7000 },
          ],
        },
        {
          title: "메뉴 2",
          product: [
            { image: "images/frame3.png", name: "카페라떼", price: 6500 },
            { image: "images/frame4.png", name: "초콜릿", price: 5000 },
            { image: "images/frame1.png", name: "아메카노", price: 6000 },
          ],
        },
        {
          title: "메뉴 3",
          product: [
            { image: "images/frame5.png", name: "카페라떼", price: 6500 },
            { image: "images/frame3.png", name: "초콜릿", price: 5000 },
            { image: "images/frame2.png", name: "아메리카노", price: 6000 },
          ],
        },
      ];
      const menu = document.querySelector("#menu");
      const cardContainer = document.querySelector("#cardContainer");
      //탭 메뉴 만들기
      menu.innerHTML = menuData
        .map((item, index) => {
          console.log(item, index);
          return `<div class="menu-item ${index === 0 ? "active" : ""}">${item.title}</div>`;
          //   인덱스가 0과 같다면 active 클래스가 더해지고 아니라면 빈 문자열로 없게 하겠다.
        })
        .join(""); //join을 하지 않으면 ,, 가 출력됨 왜지.
      //   menu.innerHTML = menuData.map().join("") 조인은 문자열로 만들어주는 애다. forEach 할 때랑은 다르게 +를 쓰지 않아도 된다. 맵돌릴떄의 문법이다.
      //   삼합연산자 - if, else
      // 탭 내용 만들기
      cardContainer.innerHTML = menuData
        .map((item, index) => {
          return `
               <ul class="card ${index === 0 ? "active" : ""}">
                ${item.product
                  .map((product) => {
                    return `
                  <li>
                    <img src="${product.image}" alt="${product.name}">
                    <h2>${product.name}</h2>
                    <p>가격: ${product.price.toLocaleString()}원</p>
                    </li>`;
                  })
                  .join("")}
                </ul>
        `;
        })
        .join("");
      const menuItems = document.querySelectorAll(".menu-item");
      const cards = document.querySelectorAll(".card");

      // console.log(menuItems, cards);
      // 탭에 맞는 카드 보여주는 함수
      function showCard(index) {
        //  모든 탭의 active 제거
        menuItems.forEach((item)=>{
          // console.log(item);
          item.classList.remove("active")
          
        })
        // 모든 탭 내용의 active 제거
        cards.forEach((card)=>{
          console.log(card);
          card.classList.remove("active");
          
        });
        // 클릭한 탭과 같은 번호의 카드 활성화
        menuItems[index].classList.add("active")
        // 메뉴아이템즈의 인덱스번호
        cards[index].classList.add("active")
      }
      // 탭 메뉴 클릭시
      menuItems.forEach((item, index)=>{
        // console.log(item, index);
        item.addEventListener("click", ()=>{
          showCard(index)
          // 쇼카드가 실행이 될건데 메뉴아이템의 index를 받아간다.
        })
        
      })
      // 쿼리셀렉터얼이라 add이벤트리스트너가 안뜸 각각 꺼내서 써주어야 한다. >( forEach)
    </script>
  </body>
</html>

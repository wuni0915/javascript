<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>변수 2</title>
    <style>
        span {
            color: red;
        }
    </style>
</head>
<body>
    
    <script>
        //변수 연산
        let x =200;
        let y =50;
        let total = x + y;
        let total2 = x * y; // 곱하기
        // let total = x % y; 이거는 나머지가 나온다. 200을 50으로 나눈 나머지 값이 total에 들어간다.
        console.log(total);
        document.write(`<p>x와 y를 더한 값은 : ${total}</p>`)
        document.write(`<p>x와 y를 곱한 값은 : <span>${total2}</span></p>`)
    </script>
</body>
</html>

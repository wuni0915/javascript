<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>변수3</title>
</head>
<body>
    <p></p>
    <script>
        let banana = 990;
        let apple = 1500;
        let mango = 3000;
        let total = banana + apple + mango;
        // 1. banana 변수선언하고 금액을 할당하세요.
      // 2. apple 변수선언하고 금액을 할당하세요.
      // 3. mango 변수선언하고 금액을 할당하세요.
      // 4.  total변수 선언하고 banana apple mango 다 더한 식을 할당하세요
      // 화면에 바나나 사과 망고를 다 더한 금액은 ... 입니다.
        document.write(`<p>바나나와 사과, 망고를 합한 금액 : ${total.toLocaleString()}원</p>`)
        
    </script>
    <!-- 어토 리네임이 안됐던건 계정이 깃허브 ai 와 연결이 되어있어서였다. -->
</body>
</html>
